<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единый номер 112</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  body { min-height:100vh; background:#0d1117; color:#e6edf3; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:16px; padding:32px; width:100%; max-width:560px; }
  h1 { color:#ff4d4d; font-size:48px; letter-spacing:6px; margin-bottom:4px; }
  .sub { color:#8b949e; margin-bottom:22px; }
  button { padding:12px 16px; margin:6px 4px 6px 0; border:none; border-radius:10px; font-size:15px; cursor:pointer; font-weight:600; }
  .btn-red { background:#da3633; color:#fff; }
  .btn-red:hover { background:#f85149; }
  .btn-green { background:#238636; color:#fff; }
  .btn-green:hover { background:#2ea043; }
  .btn-grey { background:#30363d; color:#e6edf3; }
  input { width:100%; padding:13px; margin:8px 0; border-radius:10px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; font-size:16px; text-align:center; }
  .number-box { background:#0d1117; border:1px dashed #ff4d4d; border-radius:10px; padding:12px; font-size:18px; margin:8px 0; user-select:all; cursor:pointer; }
  .line-card { background:#0d1117; border:1px solid #30363d; border-radius:12px; padding:14px; margin:10px 0; }
  .line-name { font-weight:700; font-size:17px; }
  .line-num { color:#58a6ff; user-select:all; margin:4px 0; }
  .line-state { font-size:13px; color:#8b949e; margin:6px 0; }
  .line-state.active { color:#3fb950; font-weight:600; }
  .line-state.ring { color:#f0883e; font-weight:600; }
  .status { min-height:22px; color:#8b949e; margin:10px 0; font-size:14px; }
  .hidden { display:none; }
  .log { margin-top:18px; font-size:13px; color:#8b949e; max-height:140px; overflow-y:auto; }
  .log div { padding:3px 0; border-bottom:1px solid #21262d; }
  label.chk { font-size:14px; color:#8b949e; display:block; margin:10px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>112</h1>
  <p class="sub">Единая служба экстренных вызовов</p>

  <div id="roleSelect">
    <button class="btn-red" onclick="startOperator()">Я оператор (принимать звонки)</button>
    <button class="btn-green" onclick="showCaller()">Я вызываю службы</button>
  </div>

  <!-- ОПЕРАТОР -->
  <div id="operator" class="hidden">
    <p>Код вашей диспетчерской (придумайте, латиницей):</p>
    <input id="opCode" value="city-rp">
    <label class="chk"><input type="checkbox" id="autoAnswer"> Автоответ: сразу поставить на удержание с музыкой</label>
    <button class="btn-red" onclick="openLines()">Открыть диспетчерскую</button>
    <div id="lines"></div>
    <div class="status" id="opStatus"></div>
    <h3 style="margin-top:16px">Журнал вызовов</h3>
    <div class="log" id="log"></div>
  </div>

  <!-- ВЫЗЫВАЮЩИЙ -->
  <div id="caller" class="hidden">
    <p>Введите код диспетчерской:</p>
    <input id="callCode" value="city-rp">
    <button class="btn-red" onclick="makeCall('112')">Вызвать 112</button>
    <button class="btn-green" onclick="makeCall('103')">Вызвать 103 (скорая)</button>
    <button class="btn-grey" onclick="makeCall('102')">Вызвать 102 (полиция)</button>
    <div class="status" id="callStatus"></div>
    <button class="btn-grey hidden" id="btnEndCall" onclick="endCall()">Завершить вызов</button>
  </div>
</div>

<script>
const SERVICE_NAMES = { '112': 'Единая служба 112', '103': 'Скорая помощь', '102': 'Полиция' };
let lines = {};            // состояние линий оператора
let micStream = null, muted = false;
let audioCtx = null, ringTimer = null;

function ensureCtx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, when, dur, vol, dest) {
  const ctx = ensureCtx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(dest || ctx.destination);
  o.start(when); o.stop(when + dur);
}
// Гудки ожидания у вызывающего (российский стандарт: 1 с тона / 4 с паузы)
function startRingback() {
  stopSound();
  ringTimer = setInterval(() => beep(425, ensureCtx().currentTime, 1, 0.1), 5000);
  beep(425, ensureCtx().currentTime, 1, 0.1);
}
// Рингтон входящего у оператора
function startIncomingRing() {
  stopSound();
  ringTimer = setInterval(() => {
    const t = ensureCtx().currentTime;
    beep(700, t, 0.3, 0.12); beep(700, t + 0.4, 0.3, 0.12);
  }, 2500);
  const t = ensureCtx().currentTime;
  beep(700, t, 0.3, 0.12); beep(700, t + 0.4, 0.3, 0.12);
}
function stopSound() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }
// Музыка удержания — генерируем звуковой поток для линии
function makeHoldStream() {
  const ctx = ensureCtx();
  const dest = ctx.createMediaStreamDestination();
  const g = ctx.createGain(); g.gain.value = 0.07; g.connect(dest);
  const osc = ctx.createOscillator(); osc.type = 'sine'; osc.connect(g); osc.start();
  const notes = [392, 523, 440, 523]; let i = 0;
  setInterval(() => { osc.frequency.value = notes[i++ % notes.length]; }, 500);
  return dest.stream;
}

/* ---------- ОПЕРАТОР ---------- */
function startOperator() {
  document.getElementById('roleSelect').classList.add('hidden');
  document.getElementById('operator').classList.remove('hidden');
}
function safeId(s) { return s.toLowerCase().replace(/[^a-z0-9-_]/g, ''); }

function openLines() {
  const code = safeId(document.getElementById('opCode').value);
  if (!code) { document.getElementById('opStatus').textContent = 'Введите код диспетчерской'; return; }
  const box = document.getElementById('lines');
  box.innerHTML = '';
  ['112', '103', '102'].forEach(num => {
    const id = num + '-' + code;
    const card = document.createElement('div');
    card.className = 'line-card';
    card.innerHTML =
      '<div class="line-name">' + SERVICE_NAMES[num] + '</div>' +
      '<div class="line-num" title="нажмите, чтобы скопировать">' + id + '</div>' +
      '<div class="line-state" id="state-' + num + '">свободна</div>' +
      '<div id="ctrl-' + num + '"></div>';
    card.querySelector('.line-num').onclick = () => navigator.clipboard && navigator.clipboard.writeText(id);
    box.appendChild(card);
    lines[num] = { peer: null, call: null, state: 'free' };

    const peer = new Peer(id);
    peer.on('open', () => setState(num, 'free', 'свободна'));
    peer.on('error', e => {
      if (e.type === 'unavailable-id') setState(num, 'free', 'номер занят — смените код');
      else setState(num, 'free', 'ошибка: ' + e.type);
    });
    peer.on('call', call => {
      if (lines[num].call) { // линия занята
        call.close(); addLog(num, 'пропущенный вызов (линия занята)'); return;
      }
      lines[num].call = call;
      addLog(num, 'входящий вызов');
      if (document.getElementById('autoAnswer').checked) answerHold(num);
      else {
        setState(num, 'ring', 'ВХОДЯЩИЙ ВЫЗОВ');
        startIncomingRing();
        showCtrl(num,
          '<button class="btn-green" onclick="answerMic(\'' + num + '\')">Ответить</button>' +
          '<button class="btn-grey" onclick="rejectCall(\'' + num + '\')">Отклонить</button>');
      }
    });
    lines[num].peer = peer;
  });
  document.getElementById('opStatus').textContent = 'Диспетчерская открыта. Страницу держите открытой.';
}

function setState(num, cls, text) {
  const el = document.getElementById('state-' + num);
  if (!el) return;
  el.className = 'line-state ' + (cls === 'free' ? '' : cls);
  el.textContent = text;
}
function showCtrl(num, html) { document.getElementById('ctrl-' + num).innerHTML = html; }

async function getMic() {
  if (micStream) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return micStream;
}
function applyMute() {
  if (micStream) micStream.getAudioTracks().forEach(t => t.enabled = !muted);
}

async function answerMic(num) {
  stopSound(); showCtrl(num, '');
  try {
    const stream = await getMic();
    lines[num].call.answer(stream);
    setState(num, 'active', 'СОЕДИНЕНИЕ УСТАНОВЛЕНО');
    addLog(num, 'принят (микрофон)');
    lines[num].call.on('close', () => closeLine(num, 'вызов завершён'));
  } catch (e) { setState(num, 'free', 'нет доступа к микрофону'); }
}

function answerHold(num) {
  stopSound();
  const call = lines[num].call;
  call.answer(makeHoldStream().getAudioTracks()[0]);
  setState(num, 'ring', 'НА УДЕРЖАНИИ (музыка)');
  addLog(num, 'поставлен на удержание');
  showCtrl(num,
    '<button class="btn-green" onclick="acceptHold(\'' + num + '\')">Принять вызов</button>' +
    '<button class="btn-grey" onclick="rejectCall(\'' + num + '\')">Завершить</button>');
  call.on('close', () => closeLine(num, 'вызов завершён'));
}

async function acceptHold(num) {
  try {
    const stream = await getMic();
    applyMute();
    const sender = lines[num].call.peerConnection.getSenders()
      .find(s => s.track && s.track.kind === 'audio');
    if (sender) await sender.replaceTrack(stream.getAudioTracks()[0]);
    setState(num, 'active', 'СОЕДИНЕНИЕ УСТАНОВЛЕНО');
    addLog(num, 'принят с удержания');
    showCtrl(num, '<button class="btn-grey" onclick="rejectCall(\'' + num + '\')">Завершить вызов</button>');
  } catch (e) { setState(num, 'free', 'нет доступа к микрофону'); }
}

function rejectCall(num) {
  stopSound();
  if (lines[num].call) lines[num].call.close();
  addLog(num, 'отклонён оператором');
  closeLine(num, 'свободна');
}
function closeLine(num, text) {
  stopSound();
  lines[num].call = null;
  setState(num, 'free', text);
  showCtrl(num, '');
}
function addLog(num, text) {
  const t = new Date().toLocaleTimeString('ru-RU');
  const div = document.createElement('div');
  div.textContent = t + ' — ' + SERVICE_NAMES[num] + ': ' + text;
  document.getElementById('log').prepend(div);
}

/* ---------- ВЫЗЫВАЮЩИЙ ---------- */
function showCaller() {
  document.getElementById('roleSelect').classList.add('hidden');
  document.getElementById('caller').classList.remove('hidden');
}
let callerCall = null;
async function makeCall(num) {
  const code = safeId(document.getElementById('callCode').value);
  const st = document.getElementById('callStatus');
  if (!code) { st.textContent = 'Введите код диспетчерской'; return; }
  if (callerCall) callerCall.close();
  try {
    const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    mic.getAudioTracks()[0].enabled = !muted;
    const peer = new Peer();
    peer.on('open', () => {
      st.textContent = 'Вызов ' + SERVICE_NAMES[num] + '…';
      startRingback();
      callerCall = peer.call(num + '-' + code, mic);
      callerCall.on('stream', remote => {
        stopSound();
        st.textContent = SERVICE_NAMES[num] + ': на линии. Оставайтесь на связи.';
        st.classList.add('active');
        document.getElementById('btnEndCall').classList.remove('hidden');
        const a = document.createElement('audio');
        a.srcObject = remote; a.autoplay = true;
        document.body.appendChild(a);
        callerCall._audio = a;
      });
      callerCall.on('close', () => {
        stopSound();
        st.textContent = 'Диспетчер завершил вызов';
        st.classList.remove('active');
        document.getElementById('btnEndCall').classList.add('hidden');
        if (callerCall && callerCall._audio) callerCall._audio.remove();
        callerCall = null;
      });
    });
  } catch (e) { st.textContent = 'Нет доступа к микрофону'; }
}
function endCall() {
  stopSound();
  if (callerCall) callerCall.close();
  document.getElementById('callStatus').textContent = 'Вызов завершён';
  document.getElementById('btnEndCall').classList.add('hidden');
}
</script>
</body>
</html>
